version: 2

sources:
  - name: fda
    database:   
    schema: raw_fda  
    tables:
      - name: ndc
        description: >
          One record for drug. 
        columns:
          - name: result
            description: Json schema contains all information about drug.
      - name: faers
        description: >
          One record per adverse event. 
        columns:
          - name: id
            description: Unique id of the record.
          - name: source_file
            description: Name of the source file.
          - name: result
            description: Json schema contains all information about adverse event.
